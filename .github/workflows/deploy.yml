# main 브랜치에 푸시하면 자동으로 빌드해서 GitHub Pages에 배포하는 워크플로입니다.
# Settings > Pages > Source 를 "GitHub Actions"로 설정해야 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동으로 재배포하고 싶을 때 쓰는 버튼
  workflow_dispatch:

# Pages 배포 권한. 이 세 줄이 빠지면 "권한 없음" 오류가 납니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹쳐 실행되면 한 줄로 세워 차례대로 처리합니다.
# cancel-in-progress를 true로 두면 연달아 푸시했을 때 앞 배포가 **중간에** 끊깁니다.
# GitHub Pages는 배포 도중 취소되면 사이트가 반쯤 올라간 상태로 남을 수 있어서,
# 공식 Pages 예시도 false를 권합니다. 어차피 마지막 것이 최종 결과가 됩니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 기준으로 정확히 동일한 버전을 설치 (npm install 대신 npm ci)
      - name: 의존성 설치
        run: npm ci

      # vite.config.ts 의 base: '/hamsterCreator/' 경로로 dist/ 폴더에 빌드됨
      - name: 빌드
        run: npm run build

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
